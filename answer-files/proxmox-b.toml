# Proxmox VE auto-installer answer file — node B (PLACEHOLDER).
#
# Real values land when B is physically assembled and the IP plan is
# finalized. See https://pve.proxmox.com/wiki/Automated_Installation for the
# canonical schema.
#
# Anything that looks like a secret here (root hash, ssh keys) is a
# placeholder. Real values must be SOPS-encrypted and templated in at
# render time — never committed in plaintext.

[global]
keyboard = "en-us"
country = "us"
fqdn = "proxmox-b.example.local"
mailto = "ops@example.com"
timezone = "America/Indiana/Indianapolis"
# Placeholder bcrypt hash — replace via SOPS-templated render.
root_password_hashed = "$6$placeholderplaceholder$placeholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholder"
# Placeholder operator pubkey.
root_ssh_keys = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPlaceholderOperatorKeyForProxmoxBPlaceholder operator@example"]

[network]
source = "from-answer"

[network.from-answer]
filter.MAC = "AA:BB:CC:DD:EE:01"   # placeholder — real MAC from B's NIC
cidr = "192.168.0.21/24"
gateway = "192.168.0.1"
dns = "192.168.0.1"

[disk-setup]
filesystem = "zfs"
zfs.raid = "raid1"
disk_list = ["sda", "sdb"]         # placeholder — replace with by-id paths
